<!DOCTYPE html>
<html>
<head>
  <title>Mobile Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <h1>Mobile App Control</h1>
  <p>Use this simulated app to switch the smart light on and off.</p>
  <button id="toggleButton" type="button">Toggle Light</button>
  <div id="statusText" class="status-text">Checking device status...</div>
  <a class="back-link" href="index.html">Back to dashboard</a>
</div>

<script>
const statusText = document.getElementById("statusText");
const toggleButton = document.getElementById("toggleButton");

async function loadStatus() {
  try {
    const response = await fetch("/status");
    const data = await response.json();
    statusText.textContent = data.light ? "Light is ON" : "Light is OFF";
  } catch (error) {
    statusText.textContent = "Server is unavailable right now.";
  }
}

toggleButton.addEventListener("click", async () => {
  toggleButton.disabled = true;

  try {
    const response = await fetch("/toggle", { method: "POST" });
    const data = await response.json();
    statusText.textContent = data.light ? "Light is ON" : "Light is OFF";
  } catch (error) {
    statusText.textContent = "Could not reach the server.";
  } finally {
    toggleButton.disabled = false;
  }
});

loadStatus();
</script>

</body>
</html>
